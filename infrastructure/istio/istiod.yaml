---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 10m
  timeout: 5m
  dependsOn:
    - name: istio-base
      namespace: istio-system
  chart:
    spec:
      chart: istiod
      version: '>=1.20.0 <1.24.0'
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    pilot:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    meshConfig:
      enableTracing: true
      defaultConfig:
        tracing:
          sampling: 100.0
    telemetry:
      enabled: true
      v2:
        enabled: true
        prometheus:
          enabled: true
